{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<h2>{{ page_title }}</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Save Resource
    </button>

    <a href="{% url 'resource_list' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
